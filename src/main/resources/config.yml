# Preview jobs read blocks without editing them. Nothing starts on enable.
operations-per-tick: 2048
milliseconds-per-tick: 2
progress-interval-seconds: 15
prefetch-chunks: 12
checkpoint-interval-seconds: 300
# recover disables Aeternum through the server plugin manager and snapshots its
